version: 2

sources: 
    - name: airbnb_raw
      database: AIRBNB
      schema: RAW
      config:
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 100, period: day}
          error_after: {count: 130, period: day}
      tables:
        - name: CALENDAR
        - name: LISTINGS
        - name: REVIEWS
      